[package]
name = "whittle"
version = "0.1.1"
edition = "2021"

[lib]
name = "whittle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = "0.20"
thiserror = "2"
tauri-plugin-dialog = "2"
notify = "8"
ureq = "2"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
portable-pty = "0.9.0"

[dev-dependencies]
tempfile = "3"
